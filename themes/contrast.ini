; Contrast theme
; Colors: #RRGGBB or #RRGGBBAA (with alpha: FF opaque, 00 invisible). Copy this file to /switch/NXToolBox/themes/ under a new name
; to make your own theme; keys you leave out come from the built-in contrast theme.

[theme]
name = Contrast
radius = 8

[colors]
background    = #FFFFFF
bar           = #E0E0E0
dialog        = #F0F0F0
border        = #000000
panel         = #E8E8E8
panel_hover   = #D0D0D0
accent        = #0000FF
accent_text   = #FFFFFF
selection     = #FFCC00
text          = #000000
muted         = #808080
disabled      = #C0C0C0
success       = #008000
warning       = #FFA500
error         = #FF0000
icon_bg       = #E0E0E0
overlay       = #0000008C   ; #RRGGBBAA: dims the screen behind dialogs

[editor]
background          = #FFFFFF
gutter              = #FFFFFF
line_number         = #808080
line_number_current = #000000
line_highlight      = #FFFFCC
text                = #000000
cursor              = #000000
bar                 = #E0E0E0
output              = #FFFFFF
error_line          = #FF0000
error_text          = #FF0000
keyword             = #0000FF
string              = #008000
comment             = #808080
number              = #0000FF
builtin             = #800080
function            = #0000FF
