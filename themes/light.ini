; Light theme (JetBrains New UI Light colors)
; Colors: #RRGGBB or #RRGGBBAA (with alpha: FF opaque, 00 invisible). Copy this file to /switch/NXToolBox/themes/ under a new name
; to make your own theme; keys you leave out come from the built-in dark theme.

[theme]
name = Light
radius = 8

[colors]
background    = #F7F8FA
bar           = #EBECF0
dialog        = #FFFFFF
border        = #C9CCD6
panel         = #FFFFFF
panel_hover   = #EDF3FF
accent        = #3574F0
accent_text   = #FFFFFF
selection     = #D4E2FF
text          = #1E1F22
muted         = #6C707E
disabled      = #A8ADBD
success       = #208A3C
warning       = #C27D04
error         = #DB3B4B
icon_bg       = #EBECF0
overlay       = #1E1F2259   ; #RRGGBBAA: dims the screen behind dialogs

[editor]
background          = #FFFFFF
gutter              = #FFFFFF
line_number         = #AEB3C2
line_number_current = #6C707E
line_highlight      = #F5F8FE
text                = #080808
cursor              = #000000
bar                 = #EBECF0
output              = #F7F8FA
error_line          = #FAE3E3
error_text          = #DB3B4B
keyword             = #0033B3
string              = #067D17
comment             = #8C8C8C
number              = #1750EB
builtin             = #000080
function            = #00627A
