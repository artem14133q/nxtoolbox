; Dark theme (JetBrains New UI Dark colors)
; Colors: #RRGGBB or #RRGGBBAA (with alpha: FF opaque, 00 invisible). Copy this file to /switch/NXToolBox/themes/ under a new name
; to make your own theme; keys you leave out come from the built-in dark theme.

[theme]
name = Dark
radius = 8

[colors]
background    = #1E1F22
bar           = #2B2D30
dialog        = #2B2D30
border        = #43454A
panel         = #393B40
panel_hover   = #4E5157
accent        = #3574F0
accent_text   = #FFFFFF
selection     = #2E436E
text          = #DFE1E5
muted         = #868A91
disabled      = #5A5D63
success       = #5FB865
warning       = #F2C55C
error         = #F75464
icon_bg       = #2B2D30
overlay       = #0000008C   ; #RRGGBBAA: dims the screen behind dialogs

[editor]
background          = #1E1F22
gutter              = #1E1F22
line_number         = #4B5059
line_number_current = #A1A3AB
line_highlight      = #26282E
text                = #BCBEC4
cursor              = #CED0D6
bar                 = #2B2D30
output              = #191A1C
error_line          = #5E3438
error_text          = #F75464
keyword             = #CF8E6D
string              = #6AAB73
comment             = #7A7E85
number              = #2AACB8
builtin             = #8888C6
function            = #56A8F5
